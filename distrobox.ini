# distrobox assemble create --file distrobox.ini
#
# Works on Intel and AMD GPUs as-is (Mesa is in the image). On an NVIDIA host,
# add nvidia=true.
[apps]
image=ghcr.io/danathar/appbox:latest
pull=true
replace=true
start_now=true
# Install or upgrade Claude Desktop on every box start (proprietary, so it is
# not baked into the public image). See scripts/claude-desktop-sync.
init_hooks=/usr/libexec/appbox/claude-desktop-sync
exported_apps=/usr/share/applications/signal-desktop.desktop /usr/share/applications/com.anthropic.Claude.desktop
