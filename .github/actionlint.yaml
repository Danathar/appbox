# actionlint settings, read by the `actionlint` job in .github/workflows/ci.yml.
#
# build-appbox.yml signs and verifies the image with `...@${DIGEST}` unquoted
# in two `run:` scripts (the "Sign container image" and "Verify signature"
# steps), which shellcheck reports as SC2086. DIGEST is the push step's
# sha256:<hex> digest, so it has no spaces or glob characters and the finding
# is harmless. That workflow builds and signs what every machine runs, so it
# changes only through a human-reviewed pull request, not as a side effect of
# adding CI. This ignores SC2086 in that one file only; every other workflow,
# and every other check in that file, is still enforced. Drop this entry once
# those two lines quote "${DIGEST}".
paths:
  .github/workflows/build-appbox.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:'
