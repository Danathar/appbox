name: Auto-QA

# Weekly self-tuning of the nightly compliance check. scripts/auto-qa-tuner.mjs
# reads what the last nightly runs on main measured (the published image's
# age, and how many attempts each registry operation needed, recorded as
# `auto-qa` annotations by .github/workflows/nightly-compliance.yml), plus
# each nightly job's failure rate, and proposes new values for
# .github/auto-qa-tuning.json, always inside the min and max recorded there.
# The rules are in the script's header and in the JSON's `rules` block.
#
# It never commits and never opens a pull request. main is live (every
# enrolled machine fast-forwards to it), and a pull request opened with the
# workflow token would not run CI. Instead the proposal goes into the run
# summary and into ONE tracking issue, `Auto-QA: tuning change proposed`,
# with the diff to apply in a normal pull request. When a later run proposes
# nothing (the change was applied, or the data moved back), the issue is
# closed.
#
# Two jobs so the write permission stays away from repository code: `measure`
# runs the script with a read-only token; `report` has `issues: write`, checks
# nothing out, and only reads the files `measure` produced. A failed run is
# reported by .github/workflows/auto-issues.yml, which watches this workflow
# by name.

on:
  schedule:
    - cron: '53 7 * * 1' # Mondays 07:53 UTC
  workflow_dispatch:

concurrency:
  group: auto-qa
  cancel-in-progress: false

permissions: {}

jobs:
  measure:
    name: Measure and propose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      changed: ${{ steps.tune.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Propose tuning
        id: tune
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          node scripts/auto-qa-tuner.mjs --repo "$REPO" --out-dir auto-qa-out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-qa-out
          path: auto-qa-out
          if-no-files-found: error
          retention-days: 30

  report:
    name: Open, update or close the tracking issue
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Download the proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auto-qa-out
          path: auto-qa-out

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Auto-QA: tuning change proposed'
          CHANGED: ${{ needs.measure.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # List rather than search (the search index lags and in:title is a
          # word match). Match the exact title AND the Actions bot as author,
          # so an issue someone else opens with this title is never reused.
          existing=$(gh issue list --repo "$GH_REPO" --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]" or .author.login == "github-actions"))][0].number // empty')
          if [ "$CHANGED" = true ]; then
            if [ -n "$existing" ]; then
              gh issue edit --repo "$GH_REPO" "$existing" --body-file auto-qa-out/issue-body.md
              gh issue comment --repo "$GH_REPO" "$existing" --body "Proposal refreshed by $RUN_URL."
              echo "Updated #$existing"
            else
              gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file auto-qa-out/issue-body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close --repo "$GH_REPO" "$existing" \
              --comment "No tuning change proposed by $RUN_URL; the values in .github/auto-qa-tuning.json match what the nightly runs measured. Closing."
            echo "Closed #$existing"
          else
            echo "No change proposed and no tracking issue open."
          fi
