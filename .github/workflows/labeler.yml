# Labels pull requests by the paths they change, using .github/labeler.yml.
#
# Trigger: pull_request_target, so that pull requests from forks are labelled
# too (under pull_request a fork gets a read-only token and labelling fails).
# This trigger runs with a write-capable token in the context of the base
# branch, which is only safe because this workflow never checks out or runs
# any code from the pull request: actions/labeler reads the list of changed
# files and .github/labeler.yml through the API, and the config it reads is
# the one on main, not the PR's copy. Keep it that way: do not add a checkout
# step or any step that runs PR content to this workflow.
#
# The labels are listed in .github/labeler.yml. sync-labels removes a label
# from the map when a later push stops touching its paths.

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    name: Label by path
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
