name: Policy check

# Runs scripts/check-policies.mjs: the workflow, image-safety, repo-target,
# no-secrets and secret-argv policies in policies/, the drift check between
# docs/risk-tiers.md and risk-config.json, and the hard-coded floor; then the
# checker's own tests.
# Node built-ins only, so there is no npm install. See policies/README.md.
#
# Agent pull requests merge once the required checks pass, on every tier, so
# this check is part of the gate, not advice.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: policy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-check:
    name: policy-check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Check policies
        run: node scripts/check-policies.mjs

      - name: Test the policy checker
        run: node --test scripts/tests/check-policies.test.mjs
